# main 에 push 할 때마다: exe 를 빌드해서 GitHub 릴리스(v1.0.N)로 올린다.
# 실행기는 시작할 때 이 릴리스를 확인해 '업데이트' 버튼을 켠다.
# 릴리스를 만들고 싶지 않은 커밋은 메시지에 [skip ci] 를 넣으면 된다.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 정하기
        id: ver
        shell: bash
        run: |
          VER="1.0.${{ github.run_number }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          printf '# GitHub Actions 가 빌드할 때 넣는 값\n__version__ = "%s"\n' "$VER" > checkbuff/version.py

      - name: 패치노트 (지난 릴리스 이후 커밋)
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log $RANGE --no-merges --pretty=format:'- %s' | grep -v '\[skip ci\]' > notes.md || true
          if [ ! -s notes.md ]; then echo "- 첫 배포" > notes.md; fi
          cat notes.md

      - name: 빌드
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller MelyaongChecker.spec --noconfirm

      - name: 릴리스 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" dist/MelyaongChecker.exe \
            --title "v${{ steps.ver.outputs.version }}" --notes-file notes.md --target "${{ github.sha }}"
